[package]
name = "claude-proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "claude-proxy"
path = "src/main.rs"

[dependencies]
axum = "0.6"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"     # ขนาด binary เล็กสุด
lto = true
codegen-units = 1
strip = true        # ตัด debug symbols ออก
